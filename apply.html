<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axion Tech - Job Application</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    margin:0;
}
.container{
    max-width:500px;
    margin:40px auto;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}
h2{
    text-align:center;
    color:#0b3d91;
}
input,select,textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}
button{
    width:100%;
    padding:12px;
    background:#0b3d91;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}
button:hover{
    background:#072c69;
}
</style>

</head>
<body>

<div class="container">

<h2>Axion Tech Application Form</h2>

<form action="https://formsubmit.co/hr@axiontech.org" method="POST">

<input type="text" name="Full Name" placeholder="Full Name" required>

<input type="email" name="Email" placeholder="Email Address" required>

<input type="tel" name="Mobile Number" placeholder="Mobile Number" required>

<select name="Position" required>
<option value="">Select Position</option>
<option>DevOps Internship (AWS)</option>
<option>Java Developer Internship</option>
<option>Data Science Internship</option>
<option>Machine Learning Internship</option>
</select>

<textarea name="Message" placeholder="Tell us about yourself (Optional)"></textarea>

<input type="hidden" name="_subject" value="New Internship Application - Axion Tech">

<input type="hidden" name="_captcha" value="false">

<button type="submit">Submit Application</button>

</form>

</div>

</body>
</html>
