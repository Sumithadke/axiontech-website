<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply Now - AxionTech</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f7fb;
}

.container{
    width:100%;
    max-width:500px;
    margin:50px auto;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,.15);
}

h2{
    text-align:center;
    color:#0A3D91;
    margin-bottom:20px;
}

input,select,textarea{
    width:100%;
    padding:12px;
    margin-top:12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:none;
    border-radius:6px;
    background:#0A3D91;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#072d6a;
}
</style>

</head>

<body>

<div class="container">

<h2>AxionTech Internship Application</h2>

<form action="https://formsubmit.co/hr@axiontech.org" method="POST">

<input type="text"
name="Full Name"
placeholder="Full Name"
required>

<input type="email"
name="Email"
placeholder="Email Address"
required>

<input type="tel"
name="Mobile Number"
placeholder="Mobile Number"
required>

<select name="Position" required>

<option value="">Select Position</option>

<option>DevOps Internship</option>

<option>Java Developer Internship</option>

<option>Data Science Internship</option>

<option>Machine Learning Internship</option>

</select>

<textarea
name="Message"
placeholder="Tell us about yourself (Optional)"
rows="4"></textarea>

<input type="hidden"
name="_subject"
value="New Internship Application">

<input type="hidden"
name="_captcha"
value="false">

<button type="submit">
Submit Application
</button>

</form>

</div>

</body>
</html>
